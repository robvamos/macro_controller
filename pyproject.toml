[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddgameass"
version = "0.4.0"
description = "Windows desktop macro manager and Doomsday automation assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "robvamos", email = "robvamos@gmail.com" }
]
dependencies = [
  "keyboard>=0.13.5",
  "mouse>=0.7.1",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "psutil>=5.9",
  "PyGetWindow>=0.0.9",
  "pywin32>=306",
  "soundfile>=0.12",
]
keywords = ["automation", "macro", "windows", "doomsday", "vision"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Desktop Environment",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
include-package-data = true
py-modules = [
  "bootstrap_doomsday_data",
  "db_functions",
  "debug_macro_playback",
  "game_elements",
  "gui_macro_manager",
  "macro_config",
  "macro_controller",
  "macro_editor",
  "repair_macros",
  "task_controller",
  "window_monitor",
]

[tool.setuptools.packages.find]
include = ["core*", "doomsday*", "repositories*", "services*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
